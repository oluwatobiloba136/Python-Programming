<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Data Catalog</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    padding:30px;
    background:#f4f6f8;
}

.header{
    margin-bottom:25px;
}

.header h1{
    font-size:42px;
    color:#002b5c;
    margin-bottom:10px;
}

.header p{
    font-size:18px;
    color:#555;
}

/* Search Area */

.search-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.search-box{
    background:#d8eef8;
    border-radius:10px;
    padding:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.search-box label{
    display:block;
    font-weight:600;
    color:#0d5d8e;
    margin-bottom:10px;
    font-size:18px;
}

.search-input{
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #ccc;
}

.search-icon{
    padding:12px;
    font-size:22px;
    color:#999;
}

.search-input input{
    border:none;
    outline:none;
    width:100%;
    padding:12px;
    font-size:16px;
}

/* Stats */

.stats{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    width:220px;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
}

.stat-card h2{
    color:#002b5c;
    font-size:32px;
}

.stat-card span{
    color:#666;
}

/* Table */

.table-container{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#17375E;
    color:white;
}

th{
    padding:14px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #e5e5e5;
}

tbody tr:hover{
    background:#f0f7ff;
    cursor:pointer;
}

/* Details */

.details{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.details h3{
    color:#17375E;
    margin-bottom:10px;
}

@media(max-width:900px){

.search-container{
    grid-template-columns:1fr;
}

.stats{
    flex-direction:column;
}

.stat-card{
    width:100%;
}

}

</style>
</head>

<body>

<div class="header">
    <h1>Enterprise Data Catalog & Reference</h1>
    <p>
        Centralized repository for databases, schemas, tables,
        views and business metadata.
    </p>
</div>

<div class="search-container">

    <div class="search-box">
        <label>All Databases</label>
        <div class="search-input">
            <span class="search-icon">🔍</span>
            <input type="text" id="databaseSearch"
                placeholder="Search Database">
        </div>
    </div>

    <div class="search-box">
        <label>All Tables</label>
        <div class="search-input">
            <span class="search-icon">🔍</span>
            <input type="text" id="tableSearch"
                placeholder="Search Table">
        </div>
    </div>

    <div class="search-box">
        <label>All Views</label>
        <div class="search-input">
            <span class="search-icon">🔍</span>
            <input type="text" id="viewSearch"
                placeholder="Search View">
        </div>
    </div>

</div>

<div class="stats">

    <div class="stat-card">
        <h2 id="dbCount">0</h2>
        <span>Databases</span>
    </div>

    <div class="stat-card">
        <h2 id="tableCount">0</h2>
        <span>Tables</span>
    </div>

    <div class="stat-card">
        <h2 id="viewCount">0</h2>
        <span>Views</span>
    </div>

</div>

<div class="table-container">

<table id="catalogTable">

<thead>
<tr>
<th>DATABASE_NAME</th>
<th>SCHEMA_NAME</th>
<th>OBJECT_NAME</th>
<th>OBJECT_TYPE</th>
<th>OWNER</th>
<th>DESCRIPTION</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<div class="details">

<h3>Object Details</h3>

<div id="objectDetails">
Select a table or view to see metadata.
</div>

</div>


<script>

/************************************
 SAMPLE DATA
 Replace with API or JSON source
************************************/

const catalog = [

{
database:"CC",
schema:"dbo",
object:"SV000123",
type:"Table",
owner:"Finance",
description:"Customer transaction table"
},

{
database:"CC",
schema:"dbo",
object:"CustomerRevenue",
type:"View",
owner:"BI Team",
description:"Revenue reporting view"
},

{
database:"OPS",
schema:"dbo",
object:"WorkOrders",
type:"Table",
owner:"Operations",
description:"Operational work orders"
},

{
database:"CRM",
schema:"rpt",
object:"CustomerPerformance",
type:"View",
owner:"Analytics",
description:"Customer KPI dashboard view"
}

];


function updateMetrics(){

    document.getElementById("dbCount").innerHTML =
    [...new Set(catalog.map(x=>x.database))].length;

    document.getElementById("tableCount").innerHTML =
    catalog.filter(x=>x.type==="Table").length;

    document.getElementById("viewCount").innerHTML =
    catalog.filter(x=>x.type==="View").length;
}

function loadTable(data){

    let tbody =
    document.querySelector("#catalogTable tbody");

    tbody.innerHTML = "";

    data.forEach(item=>{

        let row = document.createElement("tr");

        row.innerHTML = `
        <td>${item.database}</td>
        <td>${item.schema}</td>
        <td>${item.object}</td>
        <td>${item.type}</td>
        <td>${item.owner}</td>
        <td>${item.description}</td>
        `;

        row.addEventListener("click",()=>{

            document.getElementById(
                "objectDetails"
            ).innerHTML = `

            <b>Database:</b> ${item.database}<br><br>

            <b>Schema:</b> ${item.schema}<br><br>

            <b>Object Name:</b> ${item.object}<br><br>

            <b>Object Type:</b> ${item.type}<br><br>

            <b>Owner:</b> ${item.owner}<br><br>

            <b>Description:</b> ${item.description}

            `;
        });

        tbody.appendChild(row);

    });

}


function filterCatalog(){

    let db =
    document.getElementById("databaseSearch")
    .value.toLowerCase();

    let tbl =
    document.getElementById("tableSearch")
    .value.toLowerCase();

    let vw =
    document.getElementById("viewSearch")
    .value.toLowerCase();

    let filtered = catalog.filter(item=>{

        let matchDB =
        item.database.toLowerCase().includes(db);

        let matchTable =
        item.type === "Table"
        ? item.object.toLowerCase().includes(tbl)
        : true;

        let matchView =
        item.type === "View"
        ? item.object.toLowerCase().includes(vw)
        : true;

        return matchDB && matchTable && matchView;

    });

    loadTable(filtered);
}

document
.getElementById("databaseSearch")
.addEventListener("keyup",filterCatalog);

document
.getElementById("tableSearch")
.addEventListener("keyup",filterCatalog);

document
.getElementById("viewSearch")
.addEventListener("keyup",filterCatalog);

updateMetrics();
loadTable(catalog);

</script>

</body>
</html>
