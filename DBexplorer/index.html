<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Database Explorer</title>

<style>

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --border:#dce3ea;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.header{
    background:white;
    border-bottom:1px solid var(--border);
    padding:20px 30px;
}

.header h1{
    font-size:28px;
}

.header p{
    color:var(--muted);
    margin-top:5px;
}

.container{
    padding:20px;
}

.search-container{
    margin-bottom:20px;
    display:flex;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
}

.search-field{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
}

.search-label{
    display:block;
    width:15%;
    min-width:180px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
    color:#334155;
    background:rgba(148, 163, 184, 0.08);
    border:1px solid rgba(148, 163, 184, 0.22);
    border-radius:6px;
    padding:5px 10px;
    line-height:1.3;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
    position:static;
    transform:none;
    text-align:left;
}

.search-box{
    width:15%;
    min-width:180px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:16px;
}

.search-box:focus{
    outline:none;
    border-color:var(--primary);
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px;
    min-width:180px;
}

.card-title{
    color:var(--muted);
    font-size:13px;
}

.card-value{
    font-size:26px;
    font-weight:bold;
    margin-top:5px;
}

.table-container{
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:auto;
    max-height:70vh;
    max-width:100%;
}

#resultsTable {
    min-width: 100%;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f1f5f9;
    position:sticky;
    top:0;
}

th{
    text-align:left;
    padding:12px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
}

td{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

tr:hover{
    background:#f8fafc;
}

.loading{
    padding:30px;
    text-align:center;
}

.no-results{
    padding:30px;
    text-align:center;
    color:var(--muted);
}

</style>
</head>

<body>

<div class="header">
    <h1>Database Explorer</h1>
    <p>Full Text Search</p>
</div>

<div class="container">

    <div class="search-container">
        <div class="search-field">
            <label for="searchBox" class="search-label">All database</label>
            <input
                id="searchBox"
                class="search-box"
                type="text"
                placeholder="Search anything..."
            >
        </div>

        <div class="search-field">
            <label for="tableSearchBox" class="search-label">All Table</label>
            <input
                id="tableSearchBox"
                class="search-box"
                type="text"
                placeholder="Search tables..."
            >
        </div>

        <div class="search-field">
            <label for="viewSearchBox" class="search-label">All View</label>
            <input
                id="viewSearchBox"
                class="search-box"
                type="text"
                placeholder="Search views..."
            >
        </div>

        <div class="search-field">
            <label for="viewDependencySearchBox" class="search-label">View dependencies</label>
            <input
                id="viewDependencySearchBox"
                class="search-box"
                type="text"
                placeholder="Search dependencies..."
            >
        </div>

        <div class="search-field">
            <label for="viewReferenceSearchBox" class="search-label">View Reference</label>
            <input
                id="viewReferenceSearchBox"
                class="search-box"
                type="text"
                placeholder="Search references..."
            >
        </div>
    </div>

    <div class="stats">

        <div class="card">
            <div class="card-title">
                Total Records
            </div>
            <div id="totalRecords" class="card-value">
                0
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                Search Results
            </div>
            <div id="resultCount" class="card-value">
                0
            </div>
        </div>

    </div>

    <div class="table-container">

        <div id="loading" class="loading">
            Loading data...
        </div>

        <table id="resultsTable" style="display:none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>

    </div>

</div>

<script>

let databaseData = [];
let tableData = [];
let viewData = [];
let viewDependencyData = [];
let viewReferenceData = [];
let columns = [];
let activeSource = "tables";

// ======================================
// LOAD JSON
// ======================================

async function loadData(){

    try{

        const [databaseResponse, tableResponse, viewResponse, dependencyResponse, referenceResponse] =
            await Promise.all([
                fetch("data/databases.json"),
                fetch("data/tables.json"),
                fetch("data/views.json"),
                fetch("data/view_dep.json"),
                fetch("data/view_dep_columns.json")
            ]);

        databaseData = await databaseResponse.json();
        tableData = await tableResponse.json();
        viewData = await viewResponse.json();
        viewDependencyData = await dependencyResponse.json();
        viewReferenceData = await referenceResponse.json();

        document
            .getElementById("loading")
            .style.display = "none";

        document
            .getElementById("resultsTable")
            .style.display = "none";

        setActiveDataset("tables");

    }
    catch(error){

        document
            .getElementById("loading")
            .innerHTML =
            "Unable to load data files";

        console.error(error);
    }
}

function setActiveDataset(source){

    activeSource = source;

    const sourceData =
        source === "database"
            ? databaseData
            : source === "tables"
                ? tableData
                : source === "views"
                    ? viewData
                    : source === "dependencies"
                        ? viewDependencyData
                        : viewReferenceData;

    document
        .getElementById("totalRecords")
        .innerText = sourceData.length;

    columns =
        Object.keys(sourceData[0] || {});

    buildHeaders();
}

// ======================================
// BUILD TABLE HEADERS
// ======================================

function buildHeaders(){

    let html = "<tr>";

    columns.forEach(col => {

        html += `<th>${col}</th>`;

    });

    html += "</tr>";

    document
        .getElementById("tableHead")
        .innerHTML = html;
}

// ======================================
// DISPLAY RESULTS
// ======================================

function displayResults(rows){

    const body =
        document.getElementById("tableBody");

    document
        .getElementById("resultCount")
        .innerText = rows.length;

    if(rows.length === 0){

        body.innerHTML = `
        <tr>
            <td colspan="${columns.length}">
                <div class="no-results">
                    No Results Found
                </div>
            </td>
        </tr>`;

        return;
    }

    body.innerHTML =
        rows
        .slice(0,500)
        .map(row => {

            let tr = "<tr>";

            columns.forEach(col => {

                tr += `<td>${row[col] ?? ""}</td>`;

            });

            tr += "</tr>";

            return tr;

        })
        .join("");
}

function hideResults(){

    const resultsTable =
        document.getElementById("resultsTable");

    resultsTable.style.display = "none";
    document.getElementById("resultCount").innerText = "0";
    document.getElementById("tableBody").innerHTML = "";
}

// ======================================
// SEARCH
// ======================================

function searchDatabase(){

    const term =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("database");

    const results =
        databaseData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchTables(){

    const term =
        document
        .getElementById("tableSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("tables");

    const results =
        tableData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchViews(){

    const term =
        document
        .getElementById("viewSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("views");

    const results =
        viewData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchViewDependencies(){

    const term =
        document
        .getElementById("viewDependencySearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("dependencies");

    const results =
        viewDependencyData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchViewReferences(){

    const term =
        document
        .getElementById("viewReferenceSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("references");

    const results =
        viewReferenceData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

// ======================================
// EVENTS
// ======================================

document
.getElementById("searchBox")
.addEventListener(
    "input",
    searchDatabase
);

document
.getElementById("tableSearchBox")
.addEventListener(
    "input",
    searchTables
);

document
.getElementById("viewSearchBox")
.addEventListener(
    "input",
    searchViews
);

document
.getElementById("viewDependencySearchBox")
.addEventListener(
    "input",
    searchViewDependencies
);

document
.getElementById("viewReferenceSearchBox")
.addEventListener(
    "input",
    searchViewReferences
);

// ======================================
// START
// ======================================

loadData();

</script>

</body>
</html>
