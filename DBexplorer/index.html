<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Database Explorer</title>

<!-- Highlight.js for SQL Syntax Highlighting -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --border:#dce3ea;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.header{
    background:white;
    border-bottom:1px solid var(--border);
    padding:20px 30px;
}

.header h1{
    font-size:28px;
}

.header p{
    color:var(--muted);
    margin-top:5px;
}

.container{
    padding:20px;
}

.search-container{
    margin-bottom:20px;
    display:flex;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
}

.search-field{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
}

.search-label{
    display:block;
    width:15%;
    min-width:180px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
    color:#334155;
    background:rgba(148, 163, 184, 0.08);
    border:1px solid rgba(148, 163, 184, 0.22);
    border-radius:6px;
    padding:5px 10px;
    line-height:1.3;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
    position:static;
    transform:none;
    text-align:left;
}

.search-box{
    width:15%;
    min-width:180px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:16px;
}

.search-box:focus{
    outline:none;
    border-color:var(--primary);
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px;
    min-width:180px;
}

.card-title{
    color:var(--muted);
    font-size:13px;
}

.card-value{
    font-size:26px;
    font-weight:bold;
    margin-top:5px;
}

.table-container{
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:auto;
    max-height:70vh;
    max-width:100%;
}

#resultsTable {
    min-width: 100%;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f1f5f9;
    position:sticky;
    top:0;
}

th{
    text-align:left;
    padding:12px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
}

td{
    padding:10px 12px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

tr:hover{
    background:#f8fafc;
}

.table-link{
    color:var(--primary);
    text-decoration:none;
    cursor:pointer;
    font-weight:500;
}

.table-link:hover{
    text-decoration:underline;
    color:var(--primary-dark);
}

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

.modal-content{
    background:white;
    margin:5% auto;
    padding:20px;
    border:1px solid var(--border);
    border-radius:10px;
    width:85%;
    max-width:900px;
    max-height:80vh;
    overflow:auto;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    border-bottom:1px solid var(--border);
    padding-bottom:15px;
}

.modal-title{
    font-size:18px;
    font-weight:bold;
    color:var(--text);
}

.close-btn{
    font-size:28px;
    font-weight:bold;
    color:var(--muted);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    line-height:1;
}

.close-btn:hover{
    color:var(--text);
}

#definitionContent{
    background:#1e1e1e;
    border:1px solid var(--border);
    border-radius:6px;
    padding:15px;
    font-family:'Courier New', Courier, monospace;
    font-size:13px;
    line-height:1.7;
    color:#abb2bf;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow:auto;
    max-height:600px;
}

#definitionContent code {
    font-family:'Courier New', Courier, monospace;
    background:none;
}

.hljs {
    background:#1e1e1e;
    color:#abb2bf;
}

.hljs-keyword {
    color:#56b6f2;
    font-weight:bold;
}

.hljs-string {
    color:#98c379;
}

.hljs-number {
    color:#d19a66;
}

.hljs-literal {
    color:#56b6f2;
}



.loading{
    padding:30px;
    text-align:center;
}

.no-results{
    padding:30px;
    text-align:center;
    color:var(--muted);
}

</style>
</head>

<body>

<div class="header">
    <h1>Database Explorer</h1>
    <p>Full Text Search</p>
</div>

<div class="container">

    <div class="search-container">
        <div class="search-field">
            <label for="searchBox" class="search-label">All database</label>
            <input
                id="searchBox"
                class="search-box"
                type="text"
                placeholder="Search anything..."
            >
        </div>

        <div class="search-field">
            <label for="tableSearchBox" class="search-label">All Table</label>
            <input
                id="tableSearchBox"
                class="search-box"
                type="text"
                placeholder="Search tables..."
            >
        </div>

        <div class="search-field">
            <label for="viewSearchBox" class="search-label">All View</label>
            <input
                id="viewSearchBox"
                class="search-box"
                type="text"
                placeholder="Search views..."
            >
        </div>

        <div class="search-field">
            <label for="viewDependencySearchBox" class="search-label">View dependencies</label>
            <input
                id="viewDependencySearchBox"
                class="search-box"
                type="text"
                placeholder="Search dependencies..."
            >
        </div>

        <div class="search-field">
            <label for="viewReferenceSearchBox" class="search-label">View Reference</label>
            <input
                id="viewReferenceSearchBox"
                class="search-box"
                type="text"
                placeholder="Search references..."
            >
        </div>

        <div class="search-field">
            <label for="erdSearchBox" class="search-label">Known Relationships</label>
            <input
                id="erdSearchBox"
                class="search-box"
                type="text"
                placeholder="Search joins..."
            >
        </div>
    </div>

    <div class="stats">

        <div class="card">
            <div class="card-title">
                Total Records
            </div>
            <div id="totalRecords" class="card-value">
                0
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                Search Results
            </div>
            <div id="resultCount" class="card-value">
                0
            </div>
        </div>

    </div>

    <div class="table-container">

        <div id="loading" class="loading">
            Loading data...
        </div>

        <table id="resultsTable" style="display:none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>

    </div>

    <!-- View Definition Modal -->
    <div id="definitionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="definitionTitle" class="modal-title"></span>
                <button class="close-btn" onclick="closeDefinitionModal()">&times;</button>
            </div>
            <pre id="definitionContent"></pre>
        </div>
    </div>

</div>

<script>

let databaseData = [];
let tableData = [];
let viewData = [];
let viewDependencyData = [];
let viewReferenceData = [];
let erdData = { relationships: [] };
let columnsData = [];
let viewDefinitionsData = [];
let columns = [];
let activeSource = "tables";

// ======================================
// LOAD JSON
// ======================================

async function loadData(){

    try{

        const [databaseResponse, tableResponse, viewResponse, dependencyResponse, referenceResponse, columnsResponse, definitionsResponse, erdResponse] =
            await Promise.all([
                fetch("data/databases.json"),
                fetch("data/tables.json"),
                fetch("data/views.json"),
                fetch("data/view_dep.json"),
                fetch("data/view_dep_columns.json"),
                fetch("data/columns.json"),
                fetch("data/views_definitions.json"),
                fetch("data/vw_erd.json")
            ]);

        databaseData = await databaseResponse.json();
        tableData = await tableResponse.json();
        viewData = await viewResponse.json();
        viewDependencyData = await dependencyResponse.json();
        viewReferenceData = await referenceResponse.json();
        columnsData = await columnsResponse.json();
        viewDefinitionsData = await definitionsResponse.json();
        erdData = await erdResponse.json();

        document
            .getElementById("loading")
            .style.display = "none";

        document
            .getElementById("resultsTable")
            .style.display = "none";

        setActiveDataset("tables");

    }
    catch(error){

        document
            .getElementById("loading")
            .innerHTML =
            "Unable to load data files";

        console.error(error);
    }
}

function setActiveDataset(source){

    activeSource = source;

    const sourceData =
        source === "database"
            ? databaseData
            : source === "tables"
                ? tableData
                : source === "views"
                    ? viewData
                    : source === "dependencies"
                        ? viewDependencyData
                        : source === "references"
                            ? viewReferenceData
                            : (erdData.relationships || []);

    document
        .getElementById("totalRecords")
        .innerText = sourceData.length;

    columns =
        Object.keys(sourceData[0] || {});

    buildHeaders();
}

// ======================================
// BUILD TABLE HEADERS
// ======================================

function buildHeaders(){

    let html = "<tr>";

    columns.forEach(col => {

        html += `<th>${col}</th>`;

    });

    html += "</tr>";

    document
        .getElementById("tableHead")
        .innerHTML = html;
}

// ======================================
// DISPLAY RESULTS
// ======================================

function normalizeObjectName(value){
    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/\[/g, "")
        .replace(/\]/g, "")
        .trim()
        .split(".")
        .filter(Boolean)
        .slice(-1)[0] || "";
}

function renderSourceObjectLink(value){
    if(value === null || value === undefined || String(value).trim() === ""){
        return "";
    }

    const items = String(value)
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);

    return items.map(item => {
        const objectName = normalizeObjectName(item);

        const isView = viewData.some(v =>
            String(v.VIEW_NAME ?? "").toUpperCase() === objectName.toUpperCase()
        );

        const isTable = tableData.some(t =>
            String(t.TABLE_NAME ?? "").toUpperCase() === objectName.toUpperCase()
        );

        if(isView){
            return `<a href="#" class="table-link" onclick="showViewDefinition('${objectName}'); return false;">${item}</a>`;
        }

        if(isTable){
            return `<a href="#" class="table-link" onclick="showTableColumns('${objectName}'); return false;">${item}</a>`;
        }

        return item;
    }).join(", ");
}

function displayResults(rows){

    const body =
        document.getElementById("tableBody");

    document
        .getElementById("resultCount")
        .innerText = rows.length;

    if(rows.length === 0){

        body.innerHTML = `
        <tr>
            <td colspan="${columns.length}">
                <div class="no-results">
                    No Results Found
                </div>
            </td>
        </tr>`;

        return;
    }

    body.innerHTML =
        rows
        .slice(0,500)
        .map(row => {

            let tr = "<tr>";

            columns.forEach(col => {

                if(activeSource === "tables" && col === "TABLE_NAME"){
                    tr += `<td><a href="#" class="table-link" onclick="showTableColumns('${row[col]}'); return false;">${row[col]}</a></td>`;
                } else if(activeSource === "views" && col === "VIEW_NAME"){
                    tr += `<td><a href="#" class="table-link" onclick="showViewDefinition('${row[col]}'); return false;">${row[col]}</a></td>`;
                } else if(activeSource === "erd" && col === "source object"){
                    tr += `<td>${renderSourceObjectLink(row[col])}</td>`;
                } else {
                    tr += `<td>${row[col] ?? ""}</td>`;
                }

            });

            tr += "</tr>";

            return tr;

        })
        .join("");
}

function hideResults(){

    const resultsTable =
        document.getElementById("resultsTable");

    resultsTable.style.display = "none";
    document.getElementById("resultCount").innerText = "0";
    document.getElementById("tableBody").innerHTML = "";
}

// ======================================
// SHOW TABLE COLUMNS
// ======================================

function showTableColumns(tableName){

    const matchingColumns =
        columnsData.filter(col =>
            col.table_name.toUpperCase() === tableName.toUpperCase()
        );

    if(matchingColumns.length === 0){
        alert(`No columns found for table: ${tableName}`);
        return;
    }

    columns = Object.keys(matchingColumns[0] || {});
    buildHeaders();
    displayResults(matchingColumns);

    document
        .getElementById("resultCount")
        .innerText = matchingColumns.length;
}

// ======================================
// SHOW VIEW DEFINITION
// ======================================

function showViewDefinition(viewName){

    const viewDef =
        viewDefinitionsData.find(v =>
            v.object_name.toUpperCase() === viewName.toUpperCase()
        );

    if(!viewDef){
        alert(`No definition found for view: ${viewName}`);
        return;
    }

    const modal = document.getElementById("definitionModal");
    const title = document.getElementById("definitionTitle");
    const content = document.getElementById("definitionContent");

    title.innerText = `View: ${viewDef.object_name}`;
    
    // Format and highlight SQL
    const sqlCode = formatSQL(viewDef.definition);
    content.innerHTML = `<code class="language-sql">${escapeHtml(sqlCode)}</code>`;
    
    // Apply syntax highlighting
    hljs.highlightElement(content.querySelector('code'));

    modal.style.display = "block";
}

function formatSQL(sql){
    // Basic SQL formatting: add line breaks after key clauses
    let formatted = sql
        .replace(/\s+/g, ' ') // normalize whitespace
        .replace(/\bSELECT\b/gi, '\nSELECT')
        .replace(/\bFROM\b/gi, '\nFROM')
        .replace(/\bWHERE\b/gi, '\nWHERE')
        .replace(/\bJOIN\b/gi, '\nJOIN')
        .replace(/\bINNER\s+JOIN\b/gi, '\nINNER JOIN')
        .replace(/\bLEFT\s+JOIN\b/gi, '\nLEFT JOIN')
        .replace(/\bON\b/gi, '\nON')
        .replace(/\bUNION\b/gi, '\nUNION')
        .replace(/\bGROUP\s+BY\b/gi, '\nGROUP BY')
        .replace(/\bORDER\s+BY\b/gi, '\nORDER BY')
        .replace(/\bHAVING\b/gi, '\nHAVING')
        .replace(/\bCASE\b/gi, '\nCASE')
        .replace(/\bWHEN\b/gi, '\n    WHEN')
        .replace(/\bTHEN\b/gi, ' THEN')
        .replace(/\bELSE\b/gi, '\n    ELSE')
        .replace(/\bEND\b/gi, '\nEND');
    
    return formatted.trim();
}

function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function closeDefinitionModal(){
    const modal = document.getElementById("definitionModal");
    modal.style.display = "none";
}

window.onclick = function(event){
    const modal = document.getElementById("definitionModal");
    if(event.target === modal){
        modal.style.display = "none";
    }
}

// ======================================
// SEARCH
// ======================================

function searchDatabase(){

    const term =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("database");

    const results =
        databaseData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchTables(){

    const term =
        document
        .getElementById("tableSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("tables");

    const results =
        tableData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchViews(){

    const term =
        document
        .getElementById("viewSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("views");

    const results =
        viewData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchViewDependencies(){

    const term =
        document
        .getElementById("viewDependencySearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("dependencies");

    const results =
        viewDependencyData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchViewReferences(){

    const term =
        document
        .getElementById("viewReferenceSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){

        hideResults();
        return;
    }

    setActiveDataset("references");

    const results =
        viewReferenceData.filter(row =>

            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)

        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

function searchERD(){

    const term =
        document
        .getElementById("erdSearchBox")
        .value
        .toLowerCase()
        .trim();

    if(term === ""){
        hideResults();
        return;
    }

    setActiveDataset("erd");

    const results =
        (erdData.relationships || []).filter(row =>
            Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(term)
        );

    document
        .getElementById("resultsTable")
        .style.display = "table";

    displayResults(results);
}

// ======================================
// EVENTS
// ======================================

document
.getElementById("searchBox")
.addEventListener(
    "input",
    searchDatabase
);

document
.getElementById("tableSearchBox")
.addEventListener(
    "input",
    searchTables
);

document
.getElementById("viewSearchBox")
.addEventListener(
    "input",
    searchViews
);

document
.getElementById("viewDependencySearchBox")
.addEventListener(
    "input",
    searchViewDependencies
);

document
.getElementById("viewReferenceSearchBox")
.addEventListener(
    "input",
    searchViewReferences
);

document
.getElementById("erdSearchBox")
.addEventListener(
    "input",
    searchERD
);

// ======================================
// START
// ======================================

loadData();

</script>

</body>
</html>
